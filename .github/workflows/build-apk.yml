name: Build Qwen Image 2.1 Android Diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
      - name: Checkout libQwenImage21 upstream
        uses: actions/checkout@v4
        with:
          repository: scsonic/libQwenImage21
          path: libQwenImage21
          submodules: recursive
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Patch low-memory text encoder
        working-directory: libQwenImage21
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qwenimage21/src/main/cpp/qwen_image21_diffusion.cpp")
          s = p.read_text()
          old = '''        std::string over = "{\\\"backend_type\\\":\\\"" + backend + "\\\",\\\"thread_num\\\":" +
                           std::to_string(backend == "cpu" ? mNumThreads : 68) + "}";
          mTextEncoder->set_config(over);'''
          new = '''        std::string over = "{\\\"backend_type\\\":\\\"" + backend + "\\\",\\\"thread_num\\\":" +
                           std::to_string(backend == "cpu" ? mNumThreads : 68) +
                           ",\\\"precision\\\":\\\"low\\\",\\\"memory\\\":\\\"low\\\",\\\"use_mmap\\\":true" +
                           ",\\\"kvcache_mmap\\\":true,\\\"chunk\\\":64,\\\"tmp_path\\\":\\\"" +
                           mModelPath + "/mmap_cache\\\"}";
          mTextEncoder->set_config(over);'''
          if old not in s:
              raise SystemExit("encodePrompt patch target not found")
          s = s.replace(old, new, 1)
          s = s.replace(
              'int teNeedMB(bool vision) { return vision ? 6100 : 5600; }',
              'int teNeedMB(bool vision) { return vision ? 3000 : 2200; }'
          )
          p.write_text(s)
          print("patched", p)
          PY
      - name: Build diagnostic APK
        working-directory: libQwenImage21
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :demo:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p out
          cp libQwenImage21/demo/build/outputs/apk/debug/demo-debug.apk out/NoctQ-LowMemory-v2.apk
          sha256sum out/NoctQ-LowMemory-v2.apk | tee out/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoctQ-LowMemory-v2
          path: out/
          if-no-files-found: error
