name: Build Qwen Image 2.1 Android Diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
      - name: Checkout libQwenImage21 upstream
        uses: actions/checkout@v4
        with:
          repository: scsonic/libQwenImage21
          path: libQwenImage21
          submodules: recursive
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build diagnostic APK
        working-directory: libQwenImage21
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :demo:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p out
          cp libQwenImage21/demo/build/outputs/apk/debug/demo-debug.apk out/NoctQ-Diagnostic-Qwen21.apk
          sha256sum out/NoctQ-Diagnostic-Qwen21.apk | tee out/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoctQ-Diagnostic-Qwen21
          path: out/
          if-no-files-found: error
