name: Build Qwen Image 2.1 Android Diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
      - name: Checkout libQwenImage21 upstream
        uses: actions/checkout@v4
        with:
          repository: scsonic/libQwenImage21
          path: libQwenImage21
          submodules: recursive
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Sync Qwen MNN source to current branch
        working-directory: libQwenImage21
        run: |
          git -C third_party/MNN fetch origin qwen-image-21 --depth=1
          git -C third_party/MNN checkout deec3b3ff369a08301e9caf66ecfa646f4382ffe
          git -C third_party/MNN rev-parse HEAD
      - name: Patch low-memory text encoder
        working-directory: libQwenImage21
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/MNN/transformers/diffusion/engine/src/qwen_image21_diffusion.cpp")
          lines = p.read_text().splitlines()
          out = []
          i = 0
          patched = False
          while i < len(lines):
              if 'std::string over = "{\\\"backend_type' in lines[i]:
                  out.extend([
                      '        std::string over = "{\\\"backend_type\\\":\\\"" + backend + "\\\",\\\"thread_num\\\":" +',
                      '                           std::to_string(backend == "cpu" ? mNumThreads : 68) +',
                      '                           ",\\\"precision\\\":\\\"low\\\",\\\"memory\\\":\\\"low\\\",\\\"use_mmap\\\":true" +',
                      '                           ",\\\"kvcache_mmap\\\":true,\\\"chunk\\\":64,\\\"tmp_path\\\":\\\"" +',
                      '                           mModelPath + "/mmap_cache\\\"}";',
                      '        mTextEncoder->set_config(over);',
                  ])
                  i += 3
                  patched = True
                  continue
              line = lines[i]
              if 'int teNeedMB(bool vision)' in line:
                  line = 'int teNeedMB(bool vision) { return vision ? 3000 : 2200; }'
              out.append(line)
              i += 1
          if not patched:
              raise SystemExit("encodePrompt patch target not found")
          s = "\n".join(out) + "\n"
          s = s.replace('        if (!ensureMemory("DiT", ditNeedMB(L, N))) return false;\n',
                        '        MNN_PRINT("[QwenImage21] DiT preflight bypassed for Android low-memory diagnostic\\n");\n')
          s = s.replace('    if (!ensureMemory("DiT", ditNeedMB(P, mLatentH * mLatentW))) return false;\n',
                        '    MNN_PRINT("[QwenImage21] DiT preflight bypassed for Android low-memory diagnostic\\n");\n')
          p.write_text(s)
          print("patched", p)
          PY
      - name: Force CPU DiT and low-memory CPU backend
        working-directory: libQwenImage21
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Force JNI to create a CPU diffusion backend regardless of the UI checkbox.
          p = Path("qwenimage21/src/main/cpp/qwenimage21_jni.cpp")
          s = p.read_text()
          old = 'useGpu ? MNN_FORWARD_OPENCL : MNN_FORWARD_CPU'
          if old not in s:
              raise SystemExit("JNI GPU selector target not found")
          s = s.replace(old, 'MNN_FORWARD_CPU', 1)
          p.write_text(s)

          # CPU DiT: prefer Memory_Low for this text-to-image diagnostic.
          p = Path("third_party/MNN/transformers/diffusion/engine/src/qwen_image21_diffusion.cpp")
          s = p.read_text()
          old = 'bc.memory = BackendConfig::Memory_Normal;'
          if old not in s:
              raise SystemExit("CPU memory mode target not found")
          s = s.replace(old, 'bc.memory = BackendConfig::Memory_Low;', 1)
          p.write_text(s)
          print("forced CPU DiT + Memory_Low")
          PY
      - name: Rebuild patched MNN for Android arm64
        working-directory: libQwenImage21
        run: |
          set -eux
          export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/28.2.13676358
          export CMAKE=/usr/local/lib/android/sdk/cmake/3.22.1/bin/cmake
          MNN="$PWD/third_party/MNN"
          BUILD="$MNN/build_android_lowmem"
          rm -rf "$BUILD"
          mkdir -p "$BUILD"
          cd "$BUILD"
          "$CMAKE" .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=android-26 \
            -DANDROID_STL=c++_shared \
            -DMNN_USE_SSE=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=true \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_OPENCL=ON \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_USE_LOGCAT=ON \
            -DNATIVE_LIBRARY_OUTPUT=. \
            -DNATIVE_INCLUDE_OUTPUT=.
          "$CMAKE" --build . --target MNN -j 2
          cp libMNN.so "$GITHUB_WORKSPACE/libQwenImage21/qwenimage21/src/main/jniLibs/arm64-v8a/libMNN.so"
          ls -lh "$GITHUB_WORKSPACE/libQwenImage21/qwenimage21/src/main/jniLibs/arm64-v8a/libMNN.so"
      - name: Build diagnostic APK
        working-directory: libQwenImage21
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :demo:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p out
          cp libQwenImage21/demo/build/outputs/apk/debug/demo-debug.apk out/NoctQ-CPU-LowMemory-v4.apk
          sha256sum out/NoctQ-CPU-LowMemory-v4.apk | tee out/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoctQ-CPU-LowMemory-v4
          path: out/
          if-no-files-found: error
