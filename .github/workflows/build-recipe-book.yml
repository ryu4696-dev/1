name: Build Recipe Stock APK

on:
  workflow_dispatch:
  push:
    branches: [ recipe-book ]
    paths:
      - '.recipebook/**'
      - '.github/workflows/build-recipe-book.yml'

concurrency:
  group: recipe-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate Recipe Stock source
        run: |
          cat .recipebook/src.b64.0 .recipebook/src.b64.1 .recipebook/src.b64.2 .recipebook/src.b64.3 .recipebook/src.b64.4 > /tmp/recipe.b64
          base64 -d /tmp/recipe.b64 > /tmp/recipe-book-src.zip
          echo "25c07aadd8b29e26a9ad76fe27729985e4e9bf093f86e1fa2c87e7429abff2fa  /tmp/recipe-book-src.zip" | sha256sum -c -
          unzip -q /tmp/recipe-book-src.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build release APK
        working-directory: recipe-book
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp recipe-book/app/build/outputs/apk/release/app-release.apk RecipeStock-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeStock-APK
          path: RecipeStock-v1.0.0.apk
          if-no-files-found: error
