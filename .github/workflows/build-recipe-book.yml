name: Build MariRecipe APK

on:
  workflow_dispatch:
  push:
    branches: [ recipe-book ]
    paths:
      - '.recipebook/**'
      - '.github/workflows/build-recipe-book.yml'

concurrency:
  group: marirecipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate MariRecipe v1.5.1 source
        run: |
          cat .recipebook/v110.b64.0 .recipebook/v110.b64.1 .recipebook/v110.b64.2 > /tmp/recipe-v110.b64
          base64 -d /tmp/recipe-v110.b64 > /tmp/recipe-book-src-v1.1.0.zip
          echo "cbdeec74d96e47ff91946982f5989a7cc4bd04b93738738381cbeca542cd16d2  /tmp/recipe-book-src-v1.1.0.zip" | sha256sum -c -
          unzip -q /tmp/recipe-book-src-v1.1.0.zip -d .
          patch -p0 < .recipebook/v111.patch
          python3 .recipebook/v112.py
          python3 .recipebook/v113.py
          python3 .recipebook/v114.py
          python3 .recipebook/v115.py
          python3 .recipebook/v116.py
          python3 .recipebook/v117.py

      - name: Build illustrated artwork assets
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 .recipebook/v150-render-assets.py
          python3 .recipebook/v140-image-theme.py
          python3 .recipebook/v140-r-import-fix.py
          python3 .recipebook/v150-finalize.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure stable signing
        run: |
          mkdir -p "$HOME/.android"
          openssl pkcs12 -export             -inkey .recipebook/mari-signing-key.pem             -in .recipebook/mari-signing-cert.pem             -name androiddebugkey             -passout pass:android             -out /tmp/mari-debug.p12
          keytool -importkeystore -noprompt             -srckeystore /tmp/mari-debug.p12             -srcstoretype PKCS12             -srcstorepass android             -srcalias androiddebugkey             -destkeystore "$HOME/.android/debug.keystore"             -deststorepass android             -destkeypass android             -destalias androiddebugkey

      - name: Build release APK
        working-directory: recipe-book
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp recipe-book/app/build/outputs/apk/release/app-release.apk MariRecipe-v1.5.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MariRecipe-v1.5.1-APK
          path: MariRecipe-v1.5.1.apk
          if-no-files-found: error
