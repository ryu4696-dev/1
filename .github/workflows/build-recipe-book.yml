name: Build Recipe Stock APK

on:
  workflow_dispatch:
  push:
    branches: [ recipe-book ]
    paths:
      - '.recipebook/**'
      - '.github/workflows/build-recipe-book.yml'

concurrency:
  group: recipe-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate Recipe Stock v1.1.3 source
        run: |
          cat .recipebook/v113.b64.0 .recipebook/v113.b64.1 > /tmp/recipe-v113.b64
          base64 -d /tmp/recipe-v113.b64 > /tmp/recipe-book-src-v1.1.3.zip
          echo "5dafa1302224825ade1286b2f471654084478ef2e9bc56ed95250170bfdc38c3  /tmp/recipe-book-src-v1.1.3.zip" | sha256sum -c -
          unzip -q /tmp/recipe-book-src-v1.1.3.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        working-directory: recipe-book
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp recipe-book/app/build/outputs/apk/release/app-release.apk RecipeStock-v1.1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeStock-v1.1.3-APK
          path: RecipeStock-v1.1.3.apk
          if-no-files-found: error
