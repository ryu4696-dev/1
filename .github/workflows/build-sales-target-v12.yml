name: Build Sales Target v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - sales-target-v12
    paths:
      - '.github/workflows/build-sales-target-v12.yml'
      - '.build/sales-target-v12.tar.gz.b64.part*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete source
        shell: bash
        run: |
          cat .build/sales-target-v12.tar.gz.b64.part* | base64 -d > /tmp/sales-target-app.tar.gz
          echo "5a341c49e9137fedd32451bb09d30bb42dcd8357eb239775c575de993cfcfe0b  /tmp/sales-target-app.tar.gz" | sha256sum -c -
          rm -rf sales-target-app
          tar -xzf /tmp/sales-target-app.tar.gz -C .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sales-target-app/app/src/main/java/jp/sales/target/DataProcessor.java")
          s = p.read_text(encoding="utf-8")
          old = "private static JSONArray arrayJson(double[] arr) {"
          new = "private static JSONArray arrayJson(double[] arr) throws Exception {"
          if old not in s:
              raise SystemExit("DataProcessor patch target not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          gradle -p sales-target-app :app:assembleDebug --stacktrace
          cp sales-target-app/app/build/outputs/apk/debug/app-debug.apk "sales-target-app/app/build/outputs/apk/debug/販売目標-v1.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesTarget-v1.2
          path: sales-target-app/app/build/outputs/apk/debug/販売目標-v1.2.apk
          if-no-files-found: error
