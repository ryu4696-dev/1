name: Build Sales Target v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - sales-target-v12
    paths:
      - '.github/workflows/build-sales-target-v12.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete source
        shell: bash
        run: |
          cat .build/sales-target-v12.tar.gz.b64.part* | base64 -d > /tmp/sales-target-app.tar.gz
          echo "5a341c49e9137fedd32451bb09d30bb42dcd8357eb239775c575de993cfcfe0b  /tmp/sales-target-app.tar.gz" | sha256sum -c -
          rm -rf sales-target-app
          tar -xzf /tmp/sales-target-app.tar.gz -C .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          gradle -p sales-target-app :app:assembleDebug --stacktrace
          cp sales-target-app/app/build/outputs/apk/debug/app-debug.apk "sales-target-app/app/build/outputs/apk/debug/販売目標-v1.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesTarget-v1.2
          path: sales-target-app/app/build/outputs/apk/debug/販売目標-v1.2.apk
          if-no-files-found: error
