name: Build Sales Target v1.3

on:
  workflow_dispatch:
  push:
    branches:
      - sales-target-v13
    paths:
      - '.github/workflows/build-sales-target-v13.yml'
      - '.build/v13.part*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        shell: bash
        run: |
          cat .build/v13.part* | base64 -d > /tmp/sales-target-v1.3.tar.gz
          echo "45ca0a93e014469a733b3ea0f124736e43f3cbfc849f4eed42469cd34cf1a49d  /tmp/sales-target-v1.3.tar.gz" | sha256sum -c -
          rm -rf sales-target-app
          tar -xzf /tmp/sales-target-v1.3.tar.gz -C .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sales-target-app/app/src/main/java/jp/sales/target/DataProcessor.java")
          s = p.read_text(encoding="utf-8")
          if "private static String normalizePath(String p)" not in s:
              marker = "    private static void readGoalRow(Map<String, String> cells, int row, double[] dst, double multiplier) {"
              method = """    private static String normalizePath(String p) {
        while (p.contains("../")) {
            int i = p.indexOf("../");
            int slash = p.lastIndexOf('/', Math.max(0, i - 2));
            if (slash < 0) p = p.substring(i + 3);
            else p = p.substring(0, slash + 1) + p.substring(i + 3);
        }
        return p.replace("/./", "/");
    }

"""
              if marker not in s:
                  raise SystemExit("normalizePath insertion marker not found")
              p.write_text(s.replace(marker, method + marker, 1), encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          gradle -p sales-target-app :app:assembleDebug --stacktrace
          cp sales-target-app/app/build/outputs/apk/debug/app-debug.apk "sales-target-app/app/build/outputs/apk/debug/販売目標-v1.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesTarget-v1.3
          path: sales-target-app/app/build/outputs/apk/debug/販売目標-v1.3.apk
          if-no-files-found: error
